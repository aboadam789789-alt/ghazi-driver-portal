<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة السائقين | الغازي</title><style>
:root{color-scheme:dark;--bg:#0d1722;--panel:#172737;--line:#2c4257;--gold:#d9ad58;--txt:#f2f6fa;--muted:#9fb1c1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b1420,#14283a);color:var(--txt);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px}.brand{display:flex;align-items:center;gap:12px;margin:12px 0 24px}.logo{width:48px;height:48px;border-radius:14px;background:var(--gold);color:#172331;display:grid;place-items:center;font-size:19px;font-weight:900;letter-spacing:-1px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 12px 30px #0003}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 16px}.muted,small{color:var(--muted)}label{display:block;font-size:13px;color:#c4d1dc;margin:13px 0 7px}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0e1b28;color:white;font:inherit}textarea{min-height:76px}button{border:0;border-radius:10px;padding:13px 18px;background:var(--gold);color:#172331;font-weight:bold;font:inherit;cursor:pointer;margin-top:14px}.secondary{background:#294157;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;background:#203b4f;margin:12px 0}.danger{color:#ffb3ad}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:14px}}.approval{display:flex;align-items:center;gap:10px;margin:8px 0 0}.approval input{width:auto;min-width:18px;height:18px;accent-color:var(--gold)}
</style></head><body><main class="wrap"><div class="brand"><div class="logo" aria-label="EL-GHAZY">EL</div><div><h1>شركة الغازي للمقاولات والتوريدات</h1><small>بوابة تسجيل تشغيل المعدات</small></div></div>
<section id="login" class="panel"><h2>دخول السائق</h2><label>رقم الموظف</label><input id="emp" autocomplete="username" placeholder="رقم الموظف"><label>الرقم السري (8 أرقام)</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" placeholder="••••••••"><button id="loginBtn">تسجيل الدخول</button><div id="loginMsg" class="msg hidden"></div></section>
<section id="app" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 id="welcome">مرحباً</h2><small>سجّل التشغيل اليدوي أو ابدأ/أنه التشغيل التلقائي.</small></div><button class="secondary" id="logout" style="margin:0">خروج</button></div></div>
<div class="panel"><h2>تسجيل تشغيل يدوي</h2><form id="manual" class="grid"><div><label>المعدة</label><select id="equipment" required></select></div><div><label>المشروع</label><select id="project" required></select></div><div><label>التاريخ</label><input id="date" type="date" required></div><div><label>ساعات التشغيل</label><input id="hours" type="number" min=".1" max="24" step=".1" required placeholder="8"></div><div class="full"><label>ملاحظات</label><textarea id="notes" placeholder="تفاصيل التشغيل..."></textarea></div><div class="full"><label>صورة المعدة أو مستند التشغيل (اختياري)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><small>JPG / PNG / WEBP / PDF — بحد أقصى 10 ميجابايت</small></div><div class="full"><label class="approval"><input id="supervisorApproval" type="checkbox" required><span>اعتماد المشرف</span></label></div><div class="full"><button type="submit">إرسال للمراجعة والاعتماد</button></div></form><div id="manualMsg" class="msg hidden"></div></div>
<div class="panel"><h2>التشغيل التلقائي</h2><label>المعدة</label><select id="autoEquipment"></select><label>المشروع</label><select id="autoProject"></select><label>ملاحظات</label><textarea id="autoNotes"></textarea><label>مرفق (اختياري)</label><input id="autoFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><label class="approval"><input id="autoSupervisorApproval" type="checkbox"><span>اعتماد المشرف</span></label><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="startBtn">بدء التشغيل</button><button id="finishBtn" class="secondary">إنهاء التشغيل</button></div><div id="autoMsg" class="msg hidden"></div></div>
<div class="panel"><h2>سجلاتي الأخيرة</h2><div id="logs" class="muted">تحميل السجلات...</div></div></section></main><script>
const loginButton=document.getElementById('loginBtn'),loginMsg=document.getElementById('loginMsg');
if(loginButton)loginButton.addEventListener('click',()=>{if(!window.supabase||!window.supabase.createClient){loginMsg.textContent='خدمة تسجيل الدخول لم تكتمل بعد. انتظر لحظات ثم حاول مرة أخرى.';loginMsg.classList.remove('hidden');loginMsg.classList.add('danger');}});
loginMsg.textContent='جاري تجهيز خدمة تسجيل الدخول...';loginMsg.classList.remove('hidden');
const loader=document.createElement('script');loader.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
loader.onerror=()=>{loader.remove();const fallback=document.createElement('script');fallback.src='https://unpkg.com/@supabase/supabase-js@2';fallback.onload=runApp;fallback.onerror=()=>{loginMsg.textContent='تعذر الاتصال بخدمة الدخول. تحقق من الإنترنت أو افتح الصفحة من متصفح Chrome.';loginMsg.classList.add('danger');};document.head.appendChild(fallback);};
loader.onload=runApp;document.head.appendChild(loader);
function runApp(){if(!window.supabase||!window.supabase.createClient){loginMsg.textContent='تعذر تحميل مكتبة تسجيل الدخول.';loginMsg.classList.add('danger');return;}loginMsg.classList.add('hidden');const URL='https://csogzlzqinczlxdotfmb.supabase.co',KEY='sb_publishable_0xEG3oh5o_bPX3C42dBwcQ_Uk3-4SEt',sb=window.supabase.createClient(URL,KEY);
let user=null,driver=null,activeOp=null;const $=id=>document.getElementById(id);
function msg(id,t,bad=false){$(id).textContent=t;$(id).classList.remove('hidden');$(id).classList.toggle('danger',bad)}
function opts(el,items){$(el).innerHTML='<option value="">اختر</option>'+items.map(x=>'<option value="'+x.id+'">'+(x.name||x.equipment_code)+'</option>').join('')}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){user=session.user;await loadApp()}}
async function loadApp(){let {data:d,error}=await sb.from('drivers').select('id,employee_number').eq('profile_id',user.id).eq('is_active',true).single();if(error)throw error;driver=d;const [eq,pr]=await Promise.all([sb.from('equipment').select('id,name,equipment_code').eq('is_active',true).order('name'),sb.from('projects').select('id,name').eq('is_active',true).order('name')]);if(eq.error)throw eq.error;if(pr.error)throw pr.error;opts('equipment',eq.data);opts('autoEquipment',eq.data);opts('project',pr.data);opts('autoProject',pr.data);$('date').value=new Date().toLocaleDateString('en-CA');$('welcome').textContent='مرحباً بك — رقم الموظف '+d.employee_number;$('login').classList.add('hidden');$('app').classList.remove('hidden');await logs()}
$('loginBtn').onclick=async()=>{const b=$('loginBtn');b.disabled=true;b.textContent='جاري التحقق...';msg('loginMsg','تم الضغط على الزر، جاري الاتصال بخدمة تسجيل الدخول...');try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);let r;try{r=await fetch(URL+'/functions/v1/driver-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({employee_number:$('emp').value.trim(),pin:$('pin').value}),signal:controller.signal})}finally{clearTimeout(timeout)}const j=await r.json();if(!r.ok)throw Error(j.error||'تعذر تسجيل الدخول (HTTP '+r.status+')');if(!j.session)throw Error('استجابة الدخول لا تحتوي على جلسة مستخدم');const {error}=await sb.auth.setSession(j.session);if(error)throw error;const {data:{session}}=await sb.auth.getSession();user=session.user;msg('loginMsg','تم تسجيل الدخول، جاري تحميل بيانات التشغيل...');await loadApp()}catch(e){msg('loginMsg',e.name==='AbortError'?'انتهت مهلة الاتصال بعد 15 ثانية. تحقق من الإنترنت ثم حاول مرة أخرى.':(e.message||'حدث خطأ غير معروف'),true)}finally{b.disabled=false;b.textContent='تسجيل الدخول'}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function upload(file,opId){if(!file)return null;if(file.size>10*1024*1024)throw Error('الملف أكبر من 10 ميجابايت');if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(file.type))throw Error('نوع الملف غير مسموح');const ext=file.name.split('.').pop().toLowerCase(),path=driver.id+'/'+opId+'/'+crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('operation-attachments').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;const {error:linkError}=await sb.rpc('attach_driver_operation_file',{p_operation_id:opId,p_attachment_path:path});if(linkError){await sb.storage.from('operation-attachments').remove([path]);throw linkError}return path}
$('manual').onsubmit=async e=>{e.preventDefault();try{const payload={driver_id:driver.id,equipment_id:$('equipment').value,project_id:$('project').value,operation_date:$('date').value,operating_hours:Number($('hours').value),notes:$('notes').value||null,status:'pending',entry_mode:'manual'};const {data,error}=await sb.from('operation_logs').insert(payload).select('id').single();if(error)throw error;try{await upload($('file').files[0],data.id)}catch(x){msg('manualMsg','تم حفظ سجل التشغيل، لكن تعذر رفع المرفق: '+x.message,true);await logs();return}msg('manualMsg','تم إرسال سجل التشغيل للمراجعة بنجاح');$('manual').reset();$('date').value=new Date().toLocaleDateString('en-CA');await logs()}catch(x){msg('manualMsg','تعذر حفظ السجل: '+x.message,true)}};
$('startBtn').onclick=async()=>{try{const {data,error}=await sb.rpc('start_driver_operation',{p_equipment_id:$('autoEquipment').value,p_project_id:$('autoProject').value,p_notes:$('autoNotes').value||null});if(error)throw error;activeOp=typeof data==='string'?data:data?.id||data?.operation_id;msg('autoMsg','تم بدء التشغيل. رقم العملية: '+(activeOp||'تم'));}catch(e){msg('autoMsg','تعذر بدء التشغيل: '+e.message,true)}};
$('finishBtn').onclick=async()=>{try{if(!$('autoSupervisorApproval').checked)throw Error('يرجى تحديد اعتماد المشرف قبل إنهاء وإرسال التشغيل.');if(!activeOp)throw Error('لا توجد عملية بدأت من هذه الجلسة.');const {error}=await sb.rpc('finish_driver_operation',{p_operation_id:activeOp});if(error)throw error;try{await upload($('autoFile').files[0],activeOp)}catch(e){msg('autoMsg','تم إنهاء التشغيل، لكن تعذر رفع المرفق: '+e.message,true);return}msg('autoMsg','تم إنهاء التشغيل وإرساله للمراجعة');activeOp=null;$('autoFile').value='';$('autoSupervisorApproval').checked=false;await logs()}catch(e){msg('autoMsg','تعذر إنهاء التشغيل: '+e.message,true)}};
async function logs(){const {data,error}=await sb.from('operation_logs').select('id,operation_date,operating_hours,status,entry_mode,notes,started_at,ended_at').eq('driver_id',driver.id).order('created_at',{ascending:false}).limit(10);if(error)throw error;$('logs').innerHTML=data.length?data.map(x=>'<div style="padding:12px 0;border-bottom:1px solid #2c4257"><b>'+x.operation_date+'</b> · '+x.operating_hours+' ساعة · '+({pending:'قيد المراجعة',approved:'معتمد',rejected:'مرفوض'}[x.status]||x.status)+'<br><small>'+(x.entry_mode==='automatic'?'تلقائي':'يدوي')+(x.notes?' · '+x.notes:'')+'</small></div>').join(''):'لا توجد سجلات بعد'}
boot().catch(e=>msg('loginMsg','تعذر تحميل البيانات: '+e.message,true));

}
</script></body></html>
